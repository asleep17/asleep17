name: Generate Snake
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 * * *"  # runs daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00FF7F&color_dots=#0B3D0B,#116611,#1A8C1A,#28B228,#38E038
            dist/github-snake-dark.svg?color_snake=#00FF7F&color_dots=#0B3D0B,#116611,#1A8C1A,#28B228,#38E038&color_background=#0A1A0A

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
